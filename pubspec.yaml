name: muscle_map_flutter
description: Muscle heatmap visualization widget for Flutter. Renders front/back body diagrams with colored muscle overlays.
version: 0.1.0
homepage: https://github.com/MuscleMap/MuscleMap

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/bodies/
