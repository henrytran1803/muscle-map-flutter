name: muscle_map_flutter
description: >-
  Muscle heatmap visualization widget for Flutter. Renders front/back body
  diagrams with colored muscle overlays using CustomPainter. Supports multiple
  color models, per-surface value overrides, and interactive tooltips.
version: 0.1.0
homepage: https://github.com/henrytran1803/muscle-map-flutter
repository: https://github.com/henrytran1803/muscle-map-flutter
issue_tracker: https://github.com/henrytran1803/muscle-map-flutter/issues

topics:
  - muscle
  - heatmap
  - visualization
  - health
  - fitness

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/bodies/
